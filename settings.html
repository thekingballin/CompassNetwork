      <script>

let vantaEffect;

function applyVanta(theme) {
if (vantaEffect) vantaEffect.destroy();

const el = document.getElementById("vanta-globe");
if (!el) return;

let bgColor, globeColor, globeColor2, textColor, pColor, h1Color;

switch (theme) {
case "dark-pink":
bgColor = "#FF69B4";
textColor = pColor = h1Color = "#000";
globeColor = globeColor2 = 0xFFFFFF;
break;
case "dark-gray":
bgColor = "#808080";
textColor = pColor = h1Color = "#000";
globeColor = globeColor2 = 0xFFFFFF;
break;
case "dark-blue":
bgColor = "#0000FF";
textColor = pColor = h1Color = "#000";
globeColor = globeColor2 = 0xFFFFFF;
break;
case "light":
bgColor = "#FFFFFF";
textColor = pColor = h1Color = "#000";
globeColor = globeColor2 = 0x000000;
break;
default:
bgColor = "#000000";
textColor = pColor = h1Color = "#fff";
globeColor = globeColor2 = 0xFFFFFF;
}

vantaEffect = VANTA.GLOBE({
el: "#vanta-globe",
mouseControls: false,
touchControls: false,
gyroControls: false,
minHeight: 200.0,
minWidth: 200.0,
scale: 1.0,
scaleMobile: 1.0,
color: globeColor,
color2: globeColor2,
backgroundColor: bgColor,
backgroundAlpha: 1.0,
showDots: false,
size: 1.0,
spacing: 15.0,
maxDistance: 20.0,
points: 10.0
});

document.body.style.backgroundImage = '';
document.body.style.backgroundColor = bgColor;
document.body.style.color = textColor;

document.querySelectorAll('p').forEach(p => p.style.color = pColor);
document.querySelectorAll('h1').forEach(h1 => h1.style.color = h1Color);
}

function applyCustomBackground(url) {
if (vantaEffect) vantaEffect.destroy();
document.body.style.backgroundImage = `url('${url}')`;
document.body.style.backgroundSize = 'cover';
document.body.style.backgroundPosition = 'center';
document.body.style.backgroundRepeat = 'no-repeat';
document.body.style.backgroundColor = 'transparent';
}

function setTheme(theme) {
document.body.className = theme;
localStorage.setItem("theme", theme);
applyVanta(theme);
}

document.addEventListener('DOMContentLoaded', () => {
const input = document.getElementById('backgroundUrl');
const saveBtn = document.getElementById('saveBackground');
const removeBtn = document.getElementById('removeBackground');
const themeSelect = document.getElementById('themeSelect');

if (saveBtn && input) {
saveBtn.addEventListener('click', () => {
const url = input.value.trim();
if (url) {
localStorage.setItem('customBackground', url);
applyCustomBackground(url);
}
});
}

if (removeBtn && input) {
removeBtn.addEventListener('click', () => {
localStorage.removeItem('customBackground');
input.value = '';
setTheme("dark");
if (themeSelect) themeSelect.value = "dark";
});
}

if (themeSelect) {
themeSelect.addEventListener("change", () => {
const theme = themeSelect.value;
localStorage.removeItem("customBackground");
setTheme(theme);
});
}

const savedUrl = localStorage.getItem("customBackground");
const savedTheme = localStorage.getItem("theme") || "dark";

if (savedUrl) {
applyCustomBackground(savedUrl);
if (input) input.value = savedUrl;
} else {
setTheme(savedTheme);
if (themeSelect) themeSelect.value = savedTheme;
}
});



      </script>
