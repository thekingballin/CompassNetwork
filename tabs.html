<!DOCTYPE html>
<html>
  <head lang="em">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/static/uv/uv.bundle.js"></script>                  
    <script src="/static/uv/uv.config.js"></script>
    <script src="/static/register-sw.js"></script>
    <script src="/static/search.js"></script>
    <script src="/static/index.js" ></script>
  </head>
  <style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background-color: black;
  color: white;
  overflow: hidden;
  overscroll-behavior: none;
  box-sizing: border-box; 
  margin: 0 auto; 
  width: 95vw;
}

#tab-bar {
  display: flex;
  background-color: black;
  padding: 0.5rem;
  gap: 0.5rem;
  overflow-x: auto;
  align-items: center;
}
.tab-btn {
  background-color: black;
  color: #ffffff;
  padding: 10px 16px 10px 3px; 
  font-size: 16px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, color 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: flex-start; 
  border: 2px solid white;
  gap: 10px;
  margin-top: 15px;
  position: relative;
  min-width: 170px;
  max-width: 400px;  
  overflow: hidden; 
  flex-shrink: 0; 
}

.tab-title {
  white-space: nowrap;    
  overflow: hidden;       
  text-overflow: ellipsis;
  display: inline-block;  
  max-width: 100%;        
  padding-right: 10px;     
}



.tab-btn:hover {
  transform: translateY(-2px); 
}

.tab-btn.active {
  color: white;
  box-shadow: 0 2px 10px rgba(255, 255, 255,);
}

.close-tab-btn {
  position: absolute;
  top: 10px;
  right: 6px;
  font-weight: bold;
  cursor: pointer;
  color: #ffffff;
  font-size: 20px;
  transition: 0.1s ease-in-out; 
}

.close-tab-btn:hover {
  filter: brightness(0) saturate(100%) invert(17%) sepia(97%) saturate(7474%) hue-rotate(0deg) brightness(103%) contrast(103%);
}

#new-tab-btn {
  background-color: black;
  color: #ffffff;
  border: none;
  border-radius: 12px;
  font-size: 24px;
  width: 40px;
  height: 40px;
  cursor: pointer;
  transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
  border: 2px solid white;
  margin-top: 15px;
}
                                                                                          
#new-tab-btn:hover {
  color: white;
  transform: scale(1.15);
}



#tab-content iframe {
  top: 0;
  left: 0;
  height: 100% ;
  width: 100%;
  border: none;
}

#search-container {
  display: flex;
  align-items: center;
  padding: 10px;
  background-color: black;
  gap: 10px;
}

#search-input {
  flex: 1;
  padding: 8px 12px;
  border-radius: 8px;
  border: 2px solid white;
  background-color: black;
  color: white;
  font-size: 15px;
  outline: none;
  font-family: 'Poppins', sans-serif;
  font-weight: bold;
}

#back-btn, #forward-btn, #refresh-btn {
  background-color: black;
  color: white;
  width: 40px;
  height: 40px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid white !important;
  border-radius: 6px;
  font-size: 18px;
  cursor: pointer;
  transition: transform 0.2s ease, color 0.2s ease;
}

#back-btn:hover, #forward-btn:hover, #refresh-btn:hover {
  background-color: #000000;
  transform: scale(1.2);
}

#refresh-btn img {
  transform: rotate(0deg);
  transition: 0.4s ease, color 0.4s ease;
}


#refresh-btn:hover img {
  transform: rotate(360deg);
}



@keyframes spinRefresh {
  
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}


#tab-content {
  position: relative;
  width: 100%;
  background-color: black;
  height: calc(98vh - 140px);
  border: 2px solid white;
  margin-left: 10px;
  width: 93vw;
  border-radius: 5px;
}
::-webkit-scrollbar {
      display: none;
    } 

  .tab-icon {
  width: 23px;
  height: 23px;
  margin-right: 6px;
  margin-left: 6px;
  border-radius: 4px;
}


#fullscreen-btn {
  background-color: black;
  border: 2px solid white;
  border-radius: 6px;
  width: 43px;
  height: 41px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  cursor: pointer;
  transition: transform 0.2s ease;
}

#fullscreen-btn:hover {
  transform: scale(1.2);
}



#home-btn {
  text-decoration: none; 
}

#home-btn button {
  background-color: black;
  border: 2px solid white;
  border-radius: 6px;
  width: 43px;
  height: 41px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  cursor: pointer;
  transition: transform 0.2s ease;
}

#home-btn button:hover {
  transform: scale(1.2);
}

#loading-spinner {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(15, 15, 15, 0.75); 
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 8px solid #ffffff;
  border-top: 8px solid #000000;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}


  </style>
</head>
<body>
  
<script src="js/proxy.js"></script>

  <div id="top-bar">
    <div id="tab-bar">

    </div>
  </div>

  <div id="search-container">
    <a href="index.html" id="home-btn">
      <button>
        <img src="images/house.png" width="25px" alt="Home">
      </button>
    </a>
  
    <button id="fullscreen-btn">
      <img src="images/fullscreen.png" width="25px" alt="Fullscreen">
    </button>
  
    <input id="search-input" type="text" placeholder="Search or enter URL...">
    
    <button id="back-btn" onclick="goBack()">
      <img src="images/left.png" width="25px" alt="←">
    </button>
    <button id="forward-btn" onclick="goForward()">
      <img src="images/right.png" width="25px" alt="→">
    </button>
    <button id="refresh-btn" onclick="refreshPage()">
      <img src="images/refresh.png" width="25px" alt="↻">
    </button>
  </div>
  
  <div id="tab-content"></div>
                                                                         
  
  <div id="loading-spinner">
    <div class="spinner"></div>
  </div>
  

  <script>

"use strict";

let tabCount = 0;
let currentTabId = null;
const tabURLs = {};

const encodeUV = (input) => {
  try {
    const url = new URL(input);
    return __uv$config.prefix + __uv$config.encodeUrl(url.href);
  } catch {
    if (/^([a-z0-9-]+\.)+[a-z]{2,}$/i.test(input)) {
      return __uv$config.prefix + __uv$config.encodeUrl("https://" + input);
    }
    return __uv$config.prefix + __uv$config.encodeUrl("https://duckduckgo.com/?q=" + encodeURIComponent(input));
  }
};

function newTab() {
  tabCount++;
  const tabId = `tab-${tabCount}`;
  currentTabId = tabId;

  document.getElementById("search-input").value = "";

  const tabBtn = document.createElement("button");
  tabBtn.classList.add("tab-btn", "active");
  tabBtn.id = `btn-${tabId}`;
  tabBtn.innerHTML = `
    <img src="images/logo1.png" class="tab-icon" alt="icon">
    <span class="tab-title">New Tab</span>
    <span class="close-tab-btn" onclick="closeTab(event, '${tabId}')"><img src="images/x.png" width="25px" alt="×"></span>
  `;
  tabBtn.onclick = () => switchTab(tabId);

  document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));

  const newTabBtn = document.getElementById("new-tab-btn");
  document.getElementById("tab-bar").insertBefore(tabBtn, newTabBtn);

  const iframe = document.createElement("iframe");
  iframe.src = "";
  iframe.id = tabId;
  iframe.hidden = false;

  Array.from(document.getElementById("tab-content").children).forEach(i => i.hidden = true);
  document.getElementById("tab-content").appendChild(iframe);

  tabURLs[tabId] = "";
}

function switchTab(tabId) {
  currentTabId = tabId;
  document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
  const targetBtn = document.getElementById(`btn-${tabId}`);
  if (targetBtn) targetBtn.classList.add("active");

  Array.from(document.getElementById("tab-content").children).forEach(i => {
    i.hidden = (i.id !== tabId);
  });

  document.getElementById("search-input").value = tabURLs[tabId] || "";
}

function closeTab(event, tabId) {
  event.stopPropagation();
  const btn = document.getElementById(`btn-${tabId}`);
  const iframe = document.getElementById(tabId);
  if (btn) btn.remove();
  if (iframe) iframe.remove();
  delete tabURLs[tabId];

  if (tabId === currentTabId) {
    const remainingTabs = document.querySelectorAll(".tab-btn");
    if (remainingTabs.length > 0) {
      const nextId = remainingTabs[0].id.replace("btn-", "");
      switchTab(nextId);
    } else {
      currentTabId = null;
      document.getElementById("tab-content").innerHTML = "";
      document.getElementById("search-input").value = "";
    }
  }
}

function isMobile() {
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}

if (isMobile()) {
document.getElementById("tab-bar").style.display = "none";
document.getElementById("search-input").style.display = "none";
document.getElementById("back-btn").style.display = "none";
document.getElementById("forward-btn").style.display = "none";
document.getElementById("refresh-btn").style.display = "none";
document.getElementById("fullscreen-btn").style.display = "none";
document.getElementById("home-btn").style.display = "none";
}


document.getElementById("search-input").addEventListener("keydown", function (e) {
  if (e.key === "Enter" && currentTabId) {
    const rawInput = this.value.trim();
    const iframe = document.getElementById(currentTabId);

    if (rawInput !== "") {
      const encoded = encodeUV(rawInput);
      document.getElementById("loading-spinner").style.display = "flex"; // Show spinner
      iframe.src = encoded;

      let finalUrl;
      try {
        const parsed = new URL(rawInput);
        finalUrl = parsed.href;
      } catch {
        if (/^([a-z0-9-]+\.)+[a-z]{2,}$/i.test(rawInput)) {
          finalUrl = "https://" + rawInput;
        } else {
          finalUrl = `https://duckduckgo.com/?q=${encodeURIComponent(rawInput)}`;
        }
      }

      tabURLs[currentTabId] = finalUrl;
      document.getElementById("search-input").value = finalUrl;

      iframe.onload = () => {
        document.getElementById("loading-spinner").style.display = "none"; // Hide spinner
        const title = iframe.contentDocument.title || finalUrl;
        const tabBtn = document.getElementById(`btn-${currentTabId}`);
        if (tabBtn) {
          const titleSpan = tabBtn.querySelector('.tab-title');
          if (titleSpan) titleSpan.textContent = title;

          const titleLength = title.length * 8;
          const minWidth = 170;
          const maxWidth = 400;
          tabBtn.style.width = `${Math.min(Math.max(minWidth, titleLength), maxWidth)}px`;
        }
      };
    }
  }
});

const plusBtn = document.createElement("button");
plusBtn.id = "new-tab-btn";
plusBtn.innerText = "+";
plusBtn.onclick = () => newTab();
document.getElementById("tab-bar").appendChild(plusBtn);

function goBack() {
  const iframe = document.getElementById(currentTabId);
  if (iframe && iframe.contentWindow.history) iframe.contentWindow.history.back();
}

function goForward() {
  const iframe = document.getElementById(currentTabId);
  if (iframe && iframe.contentWindow.history) iframe.contentWindow.history.forward();
}

function refreshPage() {
  const iframe = document.getElementById(currentTabId);
  if (iframe) iframe.contentWindow.location.reload();
}

window.onload = () => {
  const query = decodeURIComponent(window.location.hash.slice(1));
  if (query) {
    newTab();

    const iframe = document.getElementById(currentTabId);
    document.getElementById("loading-spinner").style.display = "flex"; 
    iframe.src = encodeUV(query);
    tabURLs[currentTabId] = query;
    document.getElementById("search-input").value = query;

    iframe.onload = () => {
      document.getElementById("loading-spinner").style.display = "none"; 
      const title = iframe.contentDocument.title || query;
      const tabBtn = document.getElementById(`btn-${currentTabId}`);
      if (tabBtn) {
        const titleSpan = tabBtn.querySelector('.tab-title');
        if (titleSpan) titleSpan.textContent = title;

        const titleLength = title.length * 8;
        const minWidth = 170;
        const maxWidth = 400;
        tabBtn.style.width = `${Math.min(Math.max(minWidth, titleLength), maxWidth)}px`;
      }
    };
  }
};

document.getElementById("fullscreen-btn").addEventListener("click", () => {
  const iframe = document.getElementById(currentTabId);
  if (iframe) {
    if (!document.fullscreenElement) {
      iframe.requestFullscreen().catch(err => {
        console.log("Error attempting to enable fullscreen:", err);
      });
    } else {
      document.exitFullscreen().catch(err => {
        console.log("Error attempting to exit fullscreen:", err);
      });
    }
  }
});




  </script>
</body>
</html>
